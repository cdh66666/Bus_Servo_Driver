[platformio]
default_envs = bridge_com57, node_com58

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
board_build.flash_mode = dio
board_upload.before_reset = usb_reset
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:bridge_com57]
upload_port = COM57
monitor_port = COM57
build_src_filter =
  +<bridge/>
  -<node/>

[env:node_com58]
upload_port = COM58
monitor_port = COM58
build_src_filter =
  -<bridge/>
  +<node/>
