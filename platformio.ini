[platformio]
default_envs = bridge_com48_v14, node_com41_v14

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
board_build.flash_mode = dio
build_flags =
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=0

[env:bridge_com57]
upload_port = COM57
monitor_port = COM57
build_src_filter =
  +<bridge/>
  -<node/>

[env:bridge_com41_v14]
upload_port = COM41
monitor_port = COM41
upload_speed = 460800
build_src_filter =
  +<bridge/>
  -<node/>

[env:bridge_com48_v14]
upload_port = COM48
monitor_port = COM48
upload_speed = 460800
build_src_filter =
  +<bridge/>
  -<node/>

[env:node_com41_v14]
upload_port = COM41
monitor_port = COM41
upload_speed = 460800
build_src_filter =
  -<bridge/>
  +<node/>

[env:node_com48_v14]
upload_port = COM48
monitor_port = COM48
upload_speed = 460800
build_src_filter =
  -<bridge/>
  +<node/>

[env:node_com58]
upload_port = COM58
monitor_port = COM58
build_src_filter =
  -<bridge/>
  +<node/>
